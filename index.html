<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Acesso restrito</title>
<style>
  :root{
    --bg:#f6f7f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --brand:#0f766e; --brand-soft:#e6f4f1; --red:#b91c1c; --red-soft:#fee2e2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b0f10; --card:#131a1b; --ink:#e8eeee; --muted:#93a1a1; --line:#243031;
           --brand:#2dd4bf; --brand-soft:#0f2b28; --red:#f87171; --red-soft:#3a1616; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); display:grid; place-items:center;
    padding:20px; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .box{
    width:100%; max-width:390px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:30px 26px 24px; text-align:center;
    box-shadow:0 1px 2px rgba(16,24,40,.06), 0 18px 40px -24px rgba(16,24,40,.5);
  }
  .lock{
    width:56px;height:56px;margin:0 auto 16px;border-radius:50%;
    background:var(--brand-soft); color:var(--brand);
    display:grid;place-items:center;font-size:26px;
  }
  h1{font-size:20px;margin:0 0 6px;letter-spacing:-.3px}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  label.f{display:block;text-align:left;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .field{position:relative}
  input[type=password],input[type=text]{
    width:100%;padding:14px 46px 14px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;font-size:16px;outline:none;
  }
  input:focus{border-color:var(--brand)}
  .eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--muted);font-size:15px;
    padding:8px 10px;cursor:pointer;border-radius:8px;
  }
  button.go{
    width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;
    background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;
  }
  button.go:disabled{opacity:.6;cursor:progress}
  .remember{display:flex;gap:9px;align-items:flex-start;text-align:left;margin-top:14px;
    font-size:12.5px;color:var(--muted);line-height:1.4}
  .remember input{margin:2px 0 0;accent-color:var(--brand)}
  .err{
    display:none;margin-top:14px;padding:10px 12px;border-radius:10px;
    background:var(--red-soft);color:var(--red);font-size:13.5px;font-weight:600;
  }
  .err.on{display:block}
  .foot{font-size:11.5px;color:var(--muted);margin-top:20px;line-height:1.5}
  .foot b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main class="box">
  <div class="lock">&#128274;</div>
  <h1>Frederico</h1>
  <p class="sub">Histórico clínico protegido. Digite a senha para abrir.</p>

  <form id="f" autocomplete="off">
    <label class="f" for="p">Senha</label>
    <div class="field">
      <input id="p" type="password" inputmode="text" autocapitalize="none"
             autocorrect="off" spellcheck="false" placeholder="senha de acesso" autofocus>
      <button class="eye" type="button" id="eye" aria-label="Mostrar senha">&#128065;</button>
    </div>

    <label class="remember">
      <input type="checkbox" id="keep">
      <span>Manter aberto neste aparelho (não use em aparelho compartilhado)</span>
    </label>

    <button class="go" type="submit" id="btn">Abrir</button>
    <div class="err" id="err">Senha incorreta. Tente novamente.</div>
  </form>

  <p class="foot">
    Conteúdo cifrado com <b>AES-256</b>. A senha nunca é enviada a servidor algum —
    a descriptografia acontece apenas neste aparelho.
  </p>
</main>

    document.write(html);
    document.close();
  }

  const form = document.getElementById("f");
  const input = document.getElementById("p");
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");

  async function tentar(pass, guardar){
    if (busy) return;
    busy = true; btn.disabled = true; btn.textContent = "Abrindo…";
    err.classList.remove("on");
    try {
      const key = await derive(pass);
      const html = await abrirComChave(key);
      if (guardar) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw)));
      }
      render(html);
    } catch (e) {
      err.classList.add("on");
      btn.disabled = false; btn.textContent = "Abrir";
      input.select();
      busy = false;
    }
  }

  form.addEventListener("submit", ev => {
    ev.preventDefault();
    const pass = input.value;
    if (!pass) return;
    tentar(pass, document.getElementById("keep").checked);
  });

  document.getElementById("eye").addEventListener("click", () => {
    input.type = input.type === "password" ? "text" : "password";
    input.focus();
  });

  // reabre automaticamente se este aparelho já foi autorizado
  (async function(){
    const saved = localStorage.getItem(KEY_STORE);
    if (!saved) return;
    try {
      const raw = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
      const key = await crypto.subtle.importKey("raw", raw, { name:"AES-GCM" }, true, ["decrypt"]);
      const html = await abrirComChave(key);
      render(html);
    } catch (e) {
      localStorage.removeItem(KEY_STORE);
    }
  })();
})();
</script>
